                    <h2>Spinosaurus<h2>

                    <h4>Spinosaurus was a giant semi‑aquatic predatory dinosaur from North Africa, living about 100–94 million years ago, notable for its long crocodile‑like snout, conical teeth, and a tall sail formed by elongated vertebral spines. It is considered one of the largest known carnivorous dinosaurs, with length estimates around 14–18 m and adaptations suited for hunting fish.<h4>
                       
                    </figure>

                      <h2>Tyrannosaurus Rex<h2>

                    <h4>Tyrannosaurus rex was a massive bipedal carnivorous dinosaur that lived in western North America during the late Cretaceous Period, about 68–66 million years ago. Its name, Tyrannosaurus rex, means “tyrant lizard king” in Latin and Greek.rex was an apex predator that hunted large herbivores such as Triceratops and Edmontosaurus, though it also scavenged when opportunity arose.<h4>
